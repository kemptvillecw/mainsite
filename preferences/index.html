<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Update Preferences | Kemptville Creative Writers</title>

  <!-- Same styles as main site -->
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/form-helpers.css">
</head>

<body>
  <header>
    <h1>Kemptville Creative Writers</h1>
    <p class="tagline">Where stories find their voice</p>
  </header>

  <main>
    <section class="coming-soon">
      <h2>Update Your Preferences</h2>
      <p id="pref-message">Loading your preferences…</p>

      <div class="subscribe-box" style="margin-top: 2rem;">
        <form id="preferences-form">

          <!-- Email (read-only) -->
          <label for="pref-email">Email</label>
          <input
            type="email"
            id="pref-email"
            name="email"
            readonly
            style="margin-top: 0.5rem;"
          >

          <!-- Name -->
          <label for="pref-name" style="margin-top: 1rem;">Name (optional)</label>
          <input
            type="text"
            id="pref-name"
            name="name"
            style="margin-top: 0.5rem;"
          >

          <!-- Weekly calendar opt-in -->
          <div style="margin-top: 1rem;">
            <label>
              <input
                type="checkbox"
                id="pref-weekly"
                name="weekly_calendar"
                value="Yes"
              >
              Send me weekly updates about library closures and schedule changes
            </label>
          </div>

          <button type="submit" style="margin-top: 1rem;">
            Save Preferences
          </button>
        </form>

        <div id="pref-status" class="form-message" style="margin-top: 1rem;"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Kemptville Creative Writers</p>
  </footer>

  <script src="../scripts/preferences.js"></script>
</body>
</html>
