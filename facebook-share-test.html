<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KCW Facebook Share Test</title>
  <meta name="description" content="A deliberately simple Facebook sharing test page for Kemptville Creative Writers.">

  <link rel="canonical" href="https://kemptvillecw.github.io/dev/facebook-share-test.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kemptvillecw.github.io/dev/facebook-share-test.html">
  <meta property="og:title" content="KCW Facebook Share Test">
  <meta property="og:description" content="If Facebook sharing works here, the problem is in the calendar share-page flow rather than Facebook sharing in general.">
  <meta property="og:image" content="https://kemptvillecw.github.io/dev/images/about-hero-optimized.png">
  <meta property="og:image:alt" content="Kemptville Creative Writers">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f2ea;
      color: #222;
    }

    main {
      width: min(680px, calc(100% - 40px));
      padding: 32px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 { margin-top: 0; }

    a.share-button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    code {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Facebook Share Test</h1>
    <p>This page has no calendar code, no redirect, no generated metadata, and no JavaScript.</p>
    <p>Facebook should share exactly this URL:</p>
    <p><code>https://kemptvillecw.github.io/dev/facebook-share-test.html</code></p>

    <a
      class="share-button"
      href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fkemptvillecw.github.io%2Fdev%2Ffacebook-share-test.html"
      target="_blank"
      rel="noopener noreferrer"
    >Share this test on Facebook</a>
  </main>
</body>
</html>
