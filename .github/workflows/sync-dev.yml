name: Sync mainsite dev to dev main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify secret exists
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "TARGET_TOKEN is empty"
            exit 1
          fi

          echo "TARGET_TOKEN exists"
          echo "Token length: ${#TARGET_TOKEN}"

      - name: Show authenticated GitHub user
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $TARGET_TOKEN" \
            https://api.github.com/user

      - name: Test repository access
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git ls-remote \
            https://x-access-token:${TARGET_TOKEN}@github.com/kemptvillecw/dev.git

      - name: Test push permission
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git push --dry-run \
            https://x-access-token:${TARGET_TOKEN}@github.com/kemptvillecw/dev.git \
            HEAD:main

      - name: Mirror to dev repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git push \
            https://x-access-token:${TARGET_TOKEN}@github.com/kemptvillecw/dev.git \
            HEAD:main \
            --force
