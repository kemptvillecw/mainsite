name: Sync mainsite dev to dev main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secret exists
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "TARGET_TOKEN is empty"
            exit 1
          fi

          echo "TARGET_TOKEN exists"
          echo "Token length: ${#TARGET_TOKEN}"

      - name: Test repository access
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git ls-remote https://x-access-token:${TARGET_TOKEN}@github.com/kemptvillecw/dev.git

      - name: Mirror to dev repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git remote add target https://x-access-token:${TARGET_TOKEN}@github.com/kemptvillecw/dev.git
          git push target HEAD:main --force
